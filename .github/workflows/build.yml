name: Build Internet-Draft

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install xml2rfc
        run: python -m pip install "xml2rfc==3.35.0"

      - name: Render text, HTML, and expanded XML
        run: make all submit

      - name: Run idnits
        run: make idnits

      - name: Upload rendered draft
        uses: actions/upload-artifact@v7
        with:
          name: internet-draft
          path: build/

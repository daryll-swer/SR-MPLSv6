name: Paired PR auto-merge

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect the pinned pull requests without writing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: paired-pr-automerge
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'daryll-swer/SR-MPLSv6' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check pinned pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAIRED_PR_AUTOMERGE: ${{ vars.PAIRED_PR_AUTOMERGE }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python3 .github/scripts/paired_pr_automerge.py --dry-run
          else
            python3 .github/scripts/paired_pr_automerge.py
          fi
